<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Toonify Cam</title>
<meta name="description" content="Convierte tu cámara y tus videos en caricatura en tiempo real." />

<!-- PWA (manifest e íconos se generan en tiempo real, más abajo, sin archivos externos) -->
<meta name="theme-color" content="#29ABE2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Toonify" />
<link rel="manifest" id="manifestLink" />
<link rel="icon" id="iconLink" />
<link rel="apple-touch-icon" id="appleIconLink" />

<style>
@font-face {
  font-family: "AppRound";
  src: local("Baloo 2"), local("SF Pro Rounded"), local("Nunito");
}

:root {
  --ink: #1a1a2e;
  --cream: #fff9f0;
  --sky: #29abe2;
  --red: #ed1c24;
  --yellow: #ffd400;
  --green: #39b54a;
  --pink: #ec4899;
  --bg: #0f1226;
  --panel: rgba(15, 18, 38, 0.86);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  font-family: "Baloo 2", "AppRound", ui-rounded, "Nunito", system-ui, sans-serif;
  color: var(--cream);
  -webkit-user-select: none;
  user-select: none;
}

#app {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000;
}

/* ---------- Stage (camera / video canvas) ---------- */
#stage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000;
  display: block;
}

video#sourceVideo { display: none; }

#emptyState {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
  background: radial-gradient(circle at 50% 30%, #1c2350 0%, #0f1226 70%);
}

#emptyState .logo-mark {
  width: 92px; height: 92px;
  border-radius: 26px;
  background: var(--sky);
  display: flex; align-items: center; justify-content: center;
  border: 4px solid var(--ink);
  animation: wobble 2.6s ease-in-out infinite;
  box-shadow: 0 10px 0 rgba(0,0,0,0.25);
}
#emptyState .logo-mark svg { width: 52px; height: 52px; }

@keyframes wobble {
  0%, 100% { transform: rotate(-4deg) scale(1); }
  50% { transform: rotate(4deg) scale(1.04); }
}

#emptyState h1 { font-size: 26px; margin: 6px 0 0; letter-spacing: 0.3px; }
#emptyState p { margin: 0; opacity: 0.75; font-size: 15px; max-width: 320px; line-height: 1.4; }

.big-cta {
  margin-top: 10px;
  border: none;
  border-radius: 999px;
  padding: 14px 26px;
  font-family: inherit;
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  background: var(--yellow);
  box-shadow: 0 5px 0 #c79f00;
  cursor: pointer;
  transition: transform 0.08s ease;
}
.big-cta:active { transform: translateY(4px); box-shadow: 0 1px 0 #c79f00; }

.link-btn {
  background: none; border: none; color: var(--cream);
  text-decoration: underline; opacity: 0.75; font-size: 14px;
  font-family: inherit; cursor: pointer; padding: 6px;
}

/* ---------- Top bar ---------- */
#topBar {
  position: absolute;
  top: calc(var(--safe-top) + 10px);
  left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  z-index: 20;
}

.round-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 2.5px solid rgba(255,255,255,0.85);
  background: rgba(15, 18, 38, 0.55);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  color: var(--cream);
  cursor: pointer;
}
.round-btn svg { width: 22px; height: 22px; }
.round-btn:active { transform: scale(0.92); }

#styleBadge {
  display: flex; align-items: center; gap: 6px;
  background: rgba(15,18,38,0.55);
  border: 2px solid rgba(255,255,255,0.85);
  border-radius: 999px;
  padding: 8px 14px;
  font-weight: 700;
  font-size: 13px;
  backdrop-filter: blur(6px);
}
#styleBadge .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }

/* ---------- Style strip (toon presets) ---------- */
#styleStrip {
  position: absolute;
  left: 0; right: 0;
  bottom: 128px;
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 6px 16px 4px;
  z-index: 15;
}
#styleStrip::-webkit-scrollbar { display: none; }

.style-chip {
  flex: 0 0 auto;
  padding: 9px 16px;
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(15,18,38,0.55);
  backdrop-filter: blur(6px);
  color: var(--cream);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
.style-chip.active {
  background: var(--pink);
  border-color: var(--ink);
  color: var(--ink);
}

/* ---------- Bottom bar ---------- */
#bottomBar {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  padding: 10px 20px calc(var(--safe-bottom) + 20px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}

.side-btn {
  width: 52px; height: 52px;
  border-radius: 16px;
  border: 2.5px solid rgba(255,255,255,0.85);
  background: rgba(15, 18, 38, 0.5);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--cream);
  overflow: hidden;
}
.side-btn svg { width: 24px; height: 24px; }
.side-btn img { width: 100%; height: 100%; object-fit: cover; }

#shutterWrap {
  position: relative;
  width: 88px; height: 88px;
  display: flex; align-items: center; justify-content: center;
}

#shutterRing {
  position: absolute; inset: 0;
  border-radius: 50%;
  transform: rotate(-90deg);
}
#shutterRing circle {
  fill: none;
  stroke-width: 6;
}
#shutterRing .track { stroke: rgba(255,255,255,0.25); }
#shutterRing .progress {
  stroke: var(--red);
  stroke-linecap: round;
  transition: stroke-dashoffset 0.1s linear;
}

#shutterBtn {
  width: 70px; height: 70px;
  border-radius: 50%;
  background: var(--cream);
  border: 4px solid var(--ink);
  cursor: pointer;
  transition: transform 0.1s ease, border-radius 0.2s ease, background 0.2s ease;
}
#shutterBtn.recording {
  background: var(--red);
  border-radius: 20px;
  width: 34px; height: 34px;
}
#shutterBtn:active { transform: scale(0.94); }

#timerLabel {
  position: absolute;
  top: -30px;
  left: 50%; transform: translateX(-50%);
  background: var(--red);
  color: var(--cream);
  padding: 4px 10px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 13px;
  display: none;
}
#timerLabel.show { display: block; }

/* ---------- Settings panel ---------- */
#settingsPanel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: var(--panel);
  backdrop-filter: blur(10px);
  border-radius: 26px 26px 0 0;
  padding: 18px 20px calc(var(--safe-bottom) + 18px);
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(.2,.9,.3,1.2);
  z-index: 30;
  max-height: 72%;
  overflow-y: auto;
}
#settingsPanel.open { transform: translateY(0); }

.panel-handle {
  width: 40px; height: 5px; background: rgba(255,255,255,0.35);
  border-radius: 999px; margin: 0 auto 14px;
}

.panel-title { font-size: 18px; font-weight: 700; margin: 0 0 12px; display:flex; align-items:center; justify-content:space-between; }

.slider-row { margin-bottom: 16px; }
.slider-row label {
  display: flex; justify-content: space-between;
  font-size: 13px; font-weight: 700; margin-bottom: 6px; opacity: 0.9;
}
.slider-row input[type="range"] {
  width: 100%;
  accent-color: var(--pink);
  height: 26px;
}

/* ---------- Preview / Result overlay ---------- */
#previewOverlay {
  position: absolute; inset: 0;
  background: #000;
  z-index: 40;
  display: none;
  flex-direction: column;
}
#previewOverlay.show { display: flex; }
#previewOverlay video { flex: 1; width: 100%; object-fit: contain; background: #000; }

#previewActions {
  padding: 16px 20px calc(var(--safe-bottom) + 20px);
  display: flex; gap: 12px;
  background: rgba(15,18,38,0.9);
}
.action-btn {
  flex: 1;
  border: none;
  border-radius: 16px;
  padding: 14px 10px;
  font-family: inherit;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.action-btn.primary { background: var(--green); color: var(--ink); }
.action-btn.secondary { background: rgba(255,255,255,0.12); color: var(--cream); }
.action-btn.danger { background: var(--red); color: var(--cream); }

#previewTop {
  position: absolute; top: calc(var(--safe-top) + 10px); left: 14px; z-index: 41;
}

/* ---------- Processing overlay (file upload) ---------- */
#processOverlay {
  position: absolute; inset: 0;
  background: rgba(10,12,26,0.96);
  z-index: 50;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 30px;
  text-align: center;
}
#processOverlay.show { display: flex; }

.spinner-toon {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 7px solid rgba(255,255,255,0.15);
  border-top-color: var(--pink);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#progressBarWrap {
  width: 80%;
  max-width: 340px;
  height: 14px;
  background: rgba(255,255,255,0.12);
  border-radius: 999px;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.2);
}
#progressBarFill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--sky), var(--pink), var(--yellow));
  border-radius: 999px;
  transition: width 0.15s linear;
}

/* ---------- Toast ---------- */
#toast {
  position: absolute;
  left: 50%; top: calc(var(--safe-top) + 64px);
  transform: translate(-50%, -12px);
  background: var(--ink);
  color: var(--cream);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.hidden { display: none !important; }

@media (min-width: 640px) {
  #app { max-width: 480px; margin: 0 auto; box-shadow: 0 0 60px rgba(0,0,0,0.6); }
}

</style>
</head>
<body>

<div id="app">

  <!-- Camera / canvas stage -->
  <div id="stage">
    <video id="sourceVideo" playsinline muted autoplay></video>
    <canvas id="glCanvas"></canvas>
  </div>

  <!-- Empty state before camera starts -->
  <div id="emptyState">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 0 1 2-2h1.2a1 1 0 0 0 .83-.45l.94-1.4A1 1 0 0 1 9.8 3.6h4.4a1 1 0 0 1 .83.45l.94 1.4a1 1 0 0 0 .83.45H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" fill="#FFF9F0" stroke="#1A1A2E" stroke-width="1.6"/><circle cx="12" cy="13" r="3.4" fill="#ED1C24" stroke="#1A1A2E" stroke-width="1.4"/></svg>
    </div>

    <p>Convierte tu cámara o cualquier video en caricatura, al estilo de los filtros animados de Snapchat. Todo se procesa en tu teléfono.</p>
    <button class="big-cta" id="startCameraBtn">Activar cámara</button>
    <button class="link-btn" id="startUploadBtn">o convertir un video de mi galería</button>

  <!-- Top bar -->
  <div id="topBar" class="hidden">
    <button class="round-btn" id="closeCameraBtn" aria-label="Cerrar cámara">

    </button>
    <div id="styleBadge"><span class="dot"></span><span id="styleBadgeLabel">Cómic clásico</span></div>
    <button class="round-btn" id="switchCamBtn" aria-label="Cambiar cámara">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M18 4l1.5 1.5L18 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <div id="shutterWrap">
      <svg id="shutterRing" viewBox="0 0 88 88">
        <circle class="track" cx="44" cy="44" r="39"></circle>

  <!-- Settings panel -->
  <div id="settingsPanel">

      <label><span>Niveles de color</span><span id="valPoster">6</span></label>
      <input type="range" id="posterSlider" min="3" max="12" value="6" />

    <div class="slider-row">
      <label><span>Saturación</span><span id="valSat">140%</span></label>
      <input type="range" id="satSlider" min="60" max="220" value="140" />
    </div>
    <div class="slider-row">
      <label><span>Suavizado de piel</span><span id="valSmooth">55%</span></label>
      <input type="range" id="smoothSlider" min="0" max="100" value="55" />

    <div class="slider-row">
      <label><span>Brillo</span><span id="valBright">105%</span></label>
      <input type="range" id="brightSlider" min="60" max="160" value="105" />
    </div>

  <!-- Preview / result -->

    <div id="previewActions">

      <button class="action-btn primary" id="downloadBtn">Guardar video</button>

    <div id="progressBarWrap"><div id="progressBarFill"></div></div>
  </div>

  <input type="file" id="fileInput" accept="video/*" class="hidden" />

  <div id="toast"></div>
</div>

<script>

/* ============================== Íconos + manifest generados en vivo (sin archivos externos) ============================== */
function drawToonIcon(size, maskable) {
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const ctx = c.getContext("2d");
  const pad = maskable ? Math.round(size * 0.14) : 0;
  const ink = "#1a1a2e", cream = "#fff9f0";

  ctx.fillStyle = "#29abe2";
  if (maskable) {
    ctx.fillRect(0, 0, size, size);
  } else {
    const r = size * 0.22;
    ctx.beginPath();
    ctx.moveTo(pad + r, pad);
    ctx.arcTo(size - pad, pad, size - pad, size - pad, r);
    ctx.arcTo(size - pad, size - pad, pad, size - pad, r);
    ctx.arcTo(pad, size - pad, pad, pad, r);
    ctx.arcTo(pad, pad, size - pad, pad, r);
    ctx.closePath();
    ctx.fill();
  }

  const cx = size / 2, cy = size / 2;
  const camW = (size - 2 * pad) * 0.62, camH = camW * 0.72;
  const lw = Math.max(2, size * 0.018);

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  ctx.lineWidth = lw; ctx.strokeStyle = ink; ctx.fillStyle = cream;
  roundRect(cx - camW / 2, cy - camH / 2 + size * 0.02, camW, camH, camH * 0.22);
  ctx.fill(); ctx.stroke();

  const bumpW = camW * 0.30, bumpH = camH * 0.20;
  roundRect(cx - bumpW / 2, cy - camH / 2 + size * 0.02 - bumpH + lw, bumpW, bumpH, bumpH * 0.3);
  ctx.fill(); ctx.stroke();

  const lensR = camH * 0.30;
  ctx.beginPath(); ctx.arc(cx, cy + size * 0.02, lensR, 0, Math.PI * 2);
  ctx.fillStyle = "#ed1c24"; ctx.fill(); ctx.stroke();

  const lensR2 = lensR * 0.55;
  ctx.beginPath(); ctx.arc(cx, cy + size * 0.02, lensR2, 0, Math.PI * 2);
  ctx.fillStyle = "#ffd400"; ctx.fill();
  ctx.lineWidth = Math.max(2, lw * 0.8); ctx.stroke();

  return c.toDataURL("image/png");
}

function setupIconsAndManifest() {
  const icon192 = drawToonIcon(192, false);
  const icon512 = drawToonIcon(512, false);
  const iconMaskable512 = drawToonIcon(512, true);
  const iconApple = drawToonIcon(180, false);

  document.getElementById("iconLink").href = icon192;
  document.getElementById("appleIconLink").href = iconApple;

  const manifest = {
    name: "Toonify Cam",
    short_name: "Toonify",
    description: "Convierte tu cámara y tus videos en caricatura en tiempo real.",
    start_url: ".",
    scope: ".",
    display: "standalone",
    display_override: ["standalone", "fullscreen"],
    orientation: "portrait",
    background_color: "#0F1226",
    theme_color: "#29ABE2",
    icons: [
      { src: icon192, sizes: "192x192", type: "image/png", purpose: "any" },
      { src: icon512, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: iconMaskable512, sizes: "512x512", type: "image/png", purpose: "maskable" },
    ],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
  document.getElementById("manifestLink").href = URL.createObjectURL(blob);
}

/* =========================================================================
   WebGL cartoon renderer
   Pipeline por fotograma (todo en un solo pase de shader, GPU):
     1) Suaviza el ruido de piel con un blur 3x3 (para look de "piel de caricatura")
     2) Posteriza el color (reduce a pocos niveles, como el relleno plano de un cómic)
     3) Sube la saturación
     4) Detecta bordes (Sobel) y pinta líneas de tinta oscuras sobre los bordes
   ========================================================================= */

const VERTEX_SRC = `
attribute vec2 aPosition;
attribute vec2 aTexCoord;
varying vec2 vUv;
void main() {
  vUv = aTexCoord;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}
`;

const FRAGMENT_SRC = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uSampler;
uniform vec2 uTexelSize;
uniform float uPosterize;
uniform float uEdgeStrength;
uniform float uSaturation;
uniform float uSmooth;
uniform float uBrightness;
uniform vec3 uEdgeColor;

float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

vec3 sampleAt(vec2 offset) {
  return texture2D(uSampler, vUv + offset * uTexelSize).rgb;
}

void main() {
  // --- 1) suavizado 3x3 (reduce ruido tipo "piel de caricatura") ---
  vec3 blur =
    sampleAt(vec2(-1.0,-1.0)) + sampleAt(vec2(0.0,-1.0)) + sampleAt(vec2(1.0,-1.0)) +
    sampleAt(vec2(-1.0, 0.0)) + sampleAt(vec2(0.0, 0.0)) + sampleAt(vec2(1.0, 0.0)) +
    sampleAt(vec2(-1.0, 1.0)) + sampleAt(vec2(0.0, 1.0)) + sampleAt(vec2(1.0, 1.0));
  blur /= 9.0;

  vec3 base = texture2D(uSampler, vUv).rgb;
  vec3 smoothed = mix(base, blur, clamp(uSmooth, 0.0, 1.0));

  // --- 2) posterizado (relleno plano de color, como un cómic) ---
  float levels = max(uPosterize, 2.0);
  vec3 poster = floor(smoothed * levels + 0.5) / levels;

  // --- 3) saturación ---
  float g = luma(poster);
  poster = mix(vec3(g), poster, uSaturation);

  // --- brillo ---
  poster *= uBrightness;

  // --- 4) bordes Sobel sobre la imagen suavizada (evita bordes con ruido) ---
  float tl = luma(sampleAt(vec2(-1.0,-1.0)));
  float t  = luma(sampleAt(vec2( 0.0,-1.0)));
  float tr = luma(sampleAt(vec2( 1.0,-1.0)));
  float l  = luma(sampleAt(vec2(-1.0, 0.0)));
  float r  = luma(sampleAt(vec2( 1.0, 0.0)));
  float bl = luma(sampleAt(vec2(-1.0, 1.0)));
  float b  = luma(sampleAt(vec2( 0.0, 1.0)));
  float br = luma(sampleAt(vec2( 1.0, 1.0)));

  float gx = -tl - 2.0*l - bl + tr + 2.0*r + br;
  float gy = -tl - 2.0*t - tr + bl + 2.0*b + br;
  float edge = sqrt(gx*gx + gy*gy);

  float k = mix(6.0, 0.6, clamp(uEdgeStrength, 0.0, 1.0)); // más fuerza = umbral más bajo
  float ink = smoothstep(0.12 * k, 0.12 * k + 0.18, edge * (0.4 + uEdgeStrength * 1.6));

  vec3 finalColor = mix(poster, uEdgeColor, clamp(ink, 0.0, 1.0));
  gl_FragColor = vec4(finalColor, 1.0);
}
`;

class ToonRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.gl = canvas.getContext("webgl", { antialias: false, preserveDrawingBuffer: true }) ||
               canvas.getContext("experimental-webgl", { preserveDrawingBuffer: true });
    if (!this.gl) throw new Error("WebGL no disponible en este navegador");
    this._initGL();
    this.uv = { x0: 0, y0: 0, x1: 1, y1: 1 };
    this.params = { edge: 0.65, poster: 6, sat: 1.4, smooth: 0.55, bright: 1.05, edgeColor: [0.08,0.08,0.12] };
  }

  _initGL() {
    const gl = this.gl;
    const vs = this._compile(gl.VERTEX_SHADER, VERTEX_SRC);
    const fs = this._compile(gl.FRAGMENT_SHADER, FRAGMENT_SRC);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      throw new Error("Error al enlazar shader: " + gl.getProgramInfoLog(prog));
    }
    this.program = prog;
    gl.useProgram(prog);

    // quad -1..1
    this.posBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.posBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    this.uvBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.uvBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 1,1]), gl.DYNAMIC_DRAW);

    this.aPosition = gl.getAttribLocation(prog, "aPosition");
    this.aTexCoord = gl.getAttribLocation(prog, "aTexCoord");

    this.texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    this.uSampler = gl.getUniformLocation(prog, "uSampler");
    this.uTexelSize = gl.getUniformLocation(prog, "uTexelSize");
    this.uPosterize = gl.getUniformLocation(prog, "uPosterize");
    this.uEdgeStrength = gl.getUniformLocation(prog, "uEdgeStrength");
    this.uSaturation = gl.getUniformLocation(prog, "uSaturation");
    this.uSmooth = gl.getUniformLocation(prog, "uSmooth");
    this.uBrightness = gl.getUniformLocation(prog, "uBrightness");
    this.uEdgeColor = gl.getUniformLocation(prog, "uEdgeColor");
  }

  _compile(type, src) {
    const gl = this.gl;
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      throw new Error("Error de shader: " + log);
    }
    return sh;
  }

  resize(displayW, displayH) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(displayW * dpr);
    const h = Math.round(displayH * dpr);
    if (this.canvas.width !== w || this.canvas.height !== h) {
      this.canvas.width = w;
      this.canvas.height = h;
      this.gl.viewport(0, 0, w, h);
    }
  }

  setParams(p) { Object.assign(this.params, p); }

  // Calcula el recorte tipo "cover" para llenar la pantalla sin deformar
  updateCoverUV(canvasW, canvasH, mediaW, mediaH, mirror) {
    if (!mediaW || !mediaH) return;
    const canvasAspect = canvasW / canvasH;
    const mediaAspect = mediaW / mediaH;
    let x0 = 0, y0 = 0, x1 = 1, y1 = 1;
    if (mediaAspect > canvasAspect) {
      const visW = canvasAspect / mediaAspect;
      x0 = (1 - visW) / 2; x1 = 1 - x0;
    } else {
      const visH = mediaAspect / canvasAspect;
      y0 = (1 - visH) / 2; y1 = 1 - y0;
    }
    let coords;
    if (mirror) {
      coords = [x1,y0, x0,y0, x1,y1, x0,y1];
    } else {
      coords = [x0,y0, x1,y0, x0,y1, x1,y1];
    }
    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.uvBuffer);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(coords));
  }

  draw(mediaEl, mediaW, mediaH) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.texture);
    try {
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mediaEl);
    } catch (e) { return; }

    gl.useProgram(this.program);
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);

    gl.bindBuffer(gl.ARRAY_BUFFER, this.posBuffer);
    gl.enableVertexAttribArray(this.aPosition);
    gl.vertexAttribPointer(this.aPosition, 2, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, this.uvBuffer);
    gl.enableVertexAttribArray(this.aTexCoord);
    gl.vertexAttribPointer(this.aTexCoord, 2, gl.FLOAT, false, 0, 0);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.texture);
    gl.uniform1i(this.uSampler, 0);
    gl.uniform2f(this.uTexelSize, 1 / mediaW, 1 / mediaH);
    gl.uniform1f(this.uPosterize, this.params.poster);
    gl.uniform1f(this.uEdgeStrength, this.params.edge);
    gl.uniform1f(this.uSaturation, this.params.sat);
    gl.uniform1f(this.uSmooth, this.params.smooth);
    gl.uniform1f(this.uBrightness, this.params.bright);
    gl.uniform3f(this.uEdgeColor, this.params.edgeColor[0], this.params.edgeColor[1], this.params.edgeColor[2]);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
}

let renderer = null;
try {
  renderer = new ToonRenderer(els.glCanvas);
} catch (e) {

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  currentStyle = name;
  els.styleBadgeLabel.textContent = p.label;
  document.querySelectorAll(".style-chip").forEach((c) => c.classList.toggle("active", c.dataset.style === name));

  els.edgeSlider.value = p.edge; els.valEdge.textContent = p.edge + "%";
  els.posterSlider.value = p.poster; els.valPoster.textContent = p.poster;
  els.satSlider.value = p.sat; els.valSat.textContent = p.sat + "%";
  els.smoothSlider.value = p.smooth; els.valSmooth.textContent = p.smooth + "%";
  els.brightSlider.value = p.bright; els.valBright.textContent = p.bright + "%";

  pushSlidersToRenderer(p.edgeColor);
}

function pushSlidersToRenderer(edgeColorOverride) {
  if (!renderer) return;
  const edgeColor = edgeColorOverride || PRESETS[currentStyle].edgeColor;
  renderer.setParams({
    edge: (+els.edgeSlider.value) / 100,
    poster: +els.posterSlider.value,
    sat: (+els.satSlider.value) / 100,
    smooth: (+els.smoothSlider.value) / 100,
    bright: (+els.brightSlider.value) / 100,
    edgeColor,
  });
}

[els.edgeSlider, els.posterSlider, els.satSlider, els.smoothSlider, els.brightSlider].forEach((s) => {

    els.valSmooth.textContent = els.smoothSlider.value + "%";

});

/* ============================== Cámara en vivo ============================== */

const camState = {
  stream: null,
  facingMode: "user",
  running: false,
  rafId: null,
};

function isSecureEnough() {
  return window.isSecureContext || location.hostname === "localhost";
}

async function startCamera() {
  if (!isSecureEnough()) {
    toast("Necesitas HTTPS (o localhost) para usar la cámara", 3600);
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast("Este navegador no soporta acceso a cámara", 3200);
    return;
  }
  try {
    const constraints = {
      video: { facingMode: camState.facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true,
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    camState.stream = stream;
    els.sourceVideo.srcObject = stream;
    await els.sourceVideo.play();

    els.emptyState.classList.add("hidden");
    els.topBar.classList.remove("hidden");
    els.bottomBar.classList.remove("hidden");
    els.styleStrip.classList.remove("hidden");

    camState.running = true;
    resizeStage();
    loopCamera();
  } catch (err) {
    console.error(err);
    if (err && err.name === "NotAllowedError") {
      toast("Permiso de cámara denegado. Actívalo en ajustes del navegador.", 4000);
    } else {
      toast("No se pudo abrir la cámara: " + (err && err.message ? err.message : err), 4000);
    }
  }
}

function stopCamera() {
  camState.running = false;
  if (camState.rafId) cancelAnimationFrame(camState.rafId);
  if (camState.stream) {
    camState.stream.getTracks().forEach((t) => t.stop());
    camState.stream = null;
  }
  els.sourceVideo.srcObject = null;
  els.emptyState.classList.remove("hidden");
  els.topBar.classList.add("hidden");
  els.bottomBar.classList.add("hidden");
  els.styleStrip.classList.add("hidden");
  els.settingsPanel.classList.remove("open");
}

async function switchCamera() {
  camState.facingMode = camState.facingMode === "user" ? "environment" : "user";
  if (camState.stream) camState.stream.getTracks().forEach((t) => t.stop());
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: camState.facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true,
    });
    camState.stream = stream;
    els.sourceVideo.srcObject = stream;
    await els.sourceVideo.play();
  } catch (err) {
    toast("No se pudo cambiar de cámara", 2600);
  }
}

function resizeStage() {
  const rect = els.stage.getBoundingClientRect();
  if (renderer) renderer.resize(rect.width, rect.height);
}
window.addEventListener("resize", resizeStage);

function loopCamera() {
  if (!camState.running || !renderer) return;
  const v = els.sourceVideo;
  if (v.readyState >= 2 && v.videoWidth) {
    const mirror = camState.facingMode === "user";
    renderer.updateCoverUV(renderer.canvas.width, renderer.canvas.height, v.videoWidth, v.videoHeight, mirror);
    renderer.draw(v, v.videoWidth, v.videoHeight);
  }
  camState.rafId = requestAnimationFrame(loopCamera);
}

els.startCameraBtn.addEventListener("click", startCamera);
els.closeCameraBtn.addEventListener("click", stopCamera);
els.switchCamBtn.addEventListener("click", switchCamera);

/* ============================== Ajustes panel ============================== */
els.settingsBtn.addEventListener("click", () => els.settingsPanel.classList.add("open"));
els.closePanelBtn.addEventListener("click", () => els.settingsPanel.classList.remove("open"));

/* ============================== Grabación en vivo ============================== */

const recState = {
  recorder: null,
  chunks: [],
  recording: false,
  startTime: 0,
  timerId: null,
};

function pickMimeType() {
  const candidates = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm",
    "video/mp4",
  ];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return "";
}

function startRecording() {
  if (!camState.running || recState.recording) return;
  const canvasStream = renderer.canvas.captureStream(30);
  const combined = new MediaStream();
  canvasStream.getVideoTracks().forEach((t) => combined.addTrack(t));
  if (camState.stream) {
    camState.stream.getAudioTracks().forEach((t) => combined.addTrack(t));
  }

  const mimeType = pickMimeType();
  try {
    recState.recorder = new MediaRecorder(combined, mimeType ? { mimeType } : undefined);
  } catch (e) {
    toast("La grabación no es compatible con este navegador", 3200);
    return;
  }
  recState.chunks = [];
  recState.recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recState.chunks.push(e.data); };
  recState.recorder.onstop = () => {
    const blob = new Blob(recState.chunks, { type: mimeType || "video/webm" });
    showPreview(blob);
  };
  recState.recorder.start(200);
  recState.recording = true;
  recState.startTime = Date.now();

  els.shutterBtn.classList.add("recording");
  els.timerLabel.classList.add("show");
  startRing();
}

function stopRecording() {
  if (!recState.recording) return;
  recState.recording = false;
  els.shutterBtn.classList.remove("recording");
  els.timerLabel.classList.remove("show");
  stopRing();
  if (recState.recorder && recState.recorder.state !== "inactive") recState.recorder.stop();
}

const RING_CIRCUM = 245;
const MAX_SECONDS = 60;
function startRing() {
  clearInterval(recState.timerId);
  recState.timerId = setInterval(() => {
    const elapsed = (Date.now() - recState.startTime) / 1000;
    const frac = Math.min(elapsed / MAX_SECONDS, 1);
    els.ringProgress.setAttribute("stroke-dashoffset", String(RING_CIRCUM * (1 - frac)));
    const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60);
    els.timerLabel.textContent = `${m}:${String(s).padStart(2, "0")}`;
    if (elapsed >= MAX_SECONDS) stopRecording();
  }, 100);
}
function stopRing() {
  clearInterval(recState.timerId);
  els.ringProgress.setAttribute("stroke-dashoffset", String(RING_CIRCUM));
}

let holdTimer = null;
els.shutterBtn.addEventListener("click", () => {
  if (!camState.running) { toast("Activa la cámara primero"); return; }
  if (!recState.recording) startRecording(); else stopRecording();
});

/* ============================== Preview / descarga ============================== */

let lastBlob = null;
let lastThumbUrl = null;

function showPreview(blob) {
  lastBlob = blob;
  const url = URL.createObjectURL(blob);
  els.previewVideo.src = url;
  els.previewOverlay.classList.add("show");
  els.previewVideo.play().catch(() => {});

  if (lastThumbUrl) URL.revokeObjectURL(lastThumbUrl);
  lastThumbUrl = url;
  els.galleryThumb.innerHTML = `<video src="${url}" muted style="width:100%;height:100%;object-fit:cover;" playsinline></video>`;
}

function closePreview() {
  els.previewOverlay.classList.remove("show");
  els.previewVideo.pause();
}

els.previewTop.addEventListener("click", closePreview);
els.discardBtn.addEventListener("click", () => { lastBlob = null; closePreview(); });

els.downloadBtn.addEventListener("click", () => {
  if (!lastBlob) return;
  const ext = (lastBlob.type || "").includes("mp4") ? "mp4" : "webm";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(lastBlob);
  a.download = `toonify_${Date.now()}.${ext}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast("Video guardado ✔");
});

/* ============================== Subir video existente ============================== */

els.startUploadBtn.addEventListener("click", () => els.fileInput.click());
els.galleryThumb.addEventListener("click", () => { if (lastBlob) showPreview(lastBlob); else els.fileInput.click(); });

els.fileInput.addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  await processUploadedVideo(file);
});

async function processUploadedVideo(file) {
  if (!renderer) { toast("WebGL no disponible"); return; }

  els.processOverlay.classList.add("show");
  els.progressBarFill.style.width = "0%";
  els.processStatus.textContent = "Cargando video…";

  const offVideo = document.createElement("video");
  offVideo.src = URL.createObjectURL(file);
  offVideo.muted = false;
  offVideo.playsInline = true;

  await new Promise((resolve, reject) => {
    offVideo.addEventListener("loadedmetadata", resolve, { once: true });
    offVideo.addEventListener("error", () => reject(new Error("No se pudo leer el video")), { once: true });
  }).catch((err) => {
    toast(err.message);
    els.processOverlay.classList.remove("show");
    return Promise.reject(err);
  });

  const offCanvas = document.createElement("canvas");
  offCanvas.width = offVideo.videoWidth;
  offCanvas.height = offVideo.videoHeight;
  const offRenderer = new ToonRenderer(offCanvas);
  offRenderer.setParams(renderer.params);
  offRenderer.resize(offVideo.videoWidth, offVideo.videoHeight);
  offRenderer.updateCoverUV(offVideo.videoWidth, offVideo.videoHeight, offVideo.videoWidth, offVideo.videoHeight, false);

  // Pista de audio del video original (si el navegador lo permite)
  let audioTrack = null;
  try {
    const capStream = offVideo.captureStream ? offVideo.captureStream() : (offVideo.mozCaptureStream ? offVideo.mozCaptureStream() : null);
    if (capStream) {
      const at = capStream.getAudioTracks();
      if (at.length) audioTrack = at[0];
    }
  } catch (e) { /* sin audio, no pasa nada */ }

  const canvasStream = offCanvas.captureStream(30);
  const combined = new MediaStream();
  canvasStream.getVideoTracks().forEach((t) => combined.addTrack(t));
  if (audioTrack) combined.addTrack(audioTrack);

  const mimeType = pickMimeType();
  let recorder;
  try {
    recorder = new MediaRecorder(combined, mimeType ? { mimeType } : undefined);
  } catch (err) {
    toast("La grabación no es compatible con este navegador", 3200);
    els.processOverlay.classList.remove("show");
    return;
  }
  const chunks = [];
  recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };

  const done = new Promise((resolve) => { recorder.onstop = resolve; });

  els.processStatus.textContent = "Aplicando estilo caricatura…";
  recorder.start(200);

  let rafId;
  function drawLoop() {
    if (offVideo.paused || offVideo.ended) return;
    offRenderer.draw(offVideo, offVideo.videoWidth, offVideo.videoHeight);
    const frac = offVideo.duration ? offVideo.currentTime / offVideo.duration : 0;
    els.progressBarFill.style.width = Math.round(frac * 100) + "%";
    rafId = requestAnimationFrame(drawLoop);
  }

  await offVideo.play();
  drawLoop();

  await new Promise((resolve) => {
    offVideo.addEventListener("ended", resolve, { once: true });
  });
  cancelAnimationFrame(rafId);
  els.progressBarFill.style.width = "100%";
  els.processStatus.textContent = "Finalizando…";
  recorder.stop();
  await done;

  URL.revokeObjectURL(offVideo.src);
  els.processOverlay.classList.remove("show");

  const blob = new Blob(chunks, { type: mimeType || "video/webm" });
  showPreview(blob);
}

/* Evita el gesto de "pull to refresh" / zoom accidental dentro de la app */
document.addEventListener("touchmove", (e) => { if (e.scale !== 1) e.preventDefault(); }, { passive: false });

</script>
